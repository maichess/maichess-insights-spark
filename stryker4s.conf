stryker4s {
  mutate = [
    "**/main/scala/**/*.scala",
    # Mirror the scoverage exclusions: Spark job mains + live I/O glue.
    "!**/ingest/IngestJob.scala",
    "!**/analysis/AnalysisJob.scala",
    "!**/source/**/*.scala",
    "!**/sink/**/*.scala"
  ]

  scala-dialect = "scala213"

  reporters = ["console", "html"]

  thresholds {
    high = 80
    low = 60
    break = 0
  }

  excluded-mutations = []
}
